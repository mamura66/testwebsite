<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello World — v2</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #44ad1d 0%, #1e1b4b 55%, #c73a70 100%);
      color: #e2e8f0;
      text-align: center;
      padding: 1rem;
    }
    h1 { font-size: clamp(2rem, 8vw, 4rem); margin: 0 0 .5rem; }
    p { color: #94a3b8; margin: 0; }
    code { background: #1e293b; padding: .15em .4em; border-radius: 4px; }
    .badge {
      display: inline-block;
      margin-bottom: 1.25rem;
      padding: .3rem .9rem;
      border: 1px solid #7c3aed;
      border-radius: 999px;
      background: rgba(124, 58, 237, .15);
      color: #c4b5fd;
      font-size: .8rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .footer {
      margin-top: 2rem;
      font-size: .8rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">Deploy v2</span>
    <h1>Hello, World! 🚀</h1>
    <p>Deployed to Cloudflare Pages, straight from GitHub.</p>
    <p style="margin-top:1rem">Edit <code>public/index.html</code>, push, and watch it redeploy.</p>
    <p class="footer">If you can see the purple gradient and the rocket, the auto-deploy worked.</p>
  </main>
</body>
</html>
